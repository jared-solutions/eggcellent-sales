# Render Blueprint Configuration
# This file defines all services needed for the Eggcellent Sales application
# 
# To deploy: render-blueprint render.yaml

services:
  # ==================== DATABASE ====================
  # PostgreSQL Database (Free on Render)
  - name: eggcellent-db
    type: postgresql
    plan: free  # Use "starter" for production
    version: 15
    disk:
      sizeGB: 1

  # ==================== BACKEND ====================
  # Django Backend API
  - name: eggcellent-backend
    type: web
    plan: free  # Use "starter" or "standard" for production
    runtime: docker
    dockerfilePath: ../eggcellent_backend/Dockerfile
    dockerContext: ../
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: POSTGRES_DATABASE
        fromDatabase:
          name: eggcellent-db
          property: database
      - key: POSTGRES_USER
        fromDatabase:
          name: eggcellent-db
          property: username
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: eggcellent-db
          property: password
      - key: POSTGRES_HOST
        fromDatabase:
          name: eggcellent-db
          property: hostname
      - key: POSTGRES_PORT
        fromDatabase:
          name: eggcellent-db
          property: port
      - key: EMAIL_HOST_USER
        value: Eggcellentsales60@gmail.com
